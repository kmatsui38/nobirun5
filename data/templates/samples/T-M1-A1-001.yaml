id: T-M1-A1-001
item: M1-A1
item_kind: knowledge
item_index: 2
format: numeric
difficulty: 1
title: 正負の数の加法

variables:
  a: { type: int, min: -9, max: 9, exclude: [0] }
  b: { type: int, min: -9, max: 9, exclude: [0] }

constraints:
  - "a + b != 0"

derived:
  ans: "a + b"

body: |
  次の計算をしなさい。
  {a} + ({b})

answers:
  答え: "ans"

explanation: |
  同符号の2数の和は、絶対値の和に共通の符号を付けます。
  異符号の2数の和は、絶対値の差に絶対値の大きい方の符号を付けます。
  {a} + ({b}) = {ans}

status: draft
