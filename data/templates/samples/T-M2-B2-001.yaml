id: T-M2-B2-001
item: M2-B2
item_kind: knowledge
item_index: 1
format: choice
difficulty: 1
title: 三角形の合同条件（穴埋め選択）

# 3つの合同条件から1つを乱択し、穴埋めで問う（ケース分岐型）
variables:
  q: { type: int, min: 1, max: 3 }

constraints: []

derived: {}

case_var: q

body_by_case:
  1: |
    三角形の合同条件について、□にあてはまるものを選びなさい。
    「3組の□がそれぞれ等しいとき、2つの三角形は合同である。」
  2: |
    三角形の合同条件について、□にあてはまるものを選びなさい。
    「2組の辺とその□がそれぞれ等しいとき、2つの三角形は合同である。」
  3: |
    三角形の合同条件について、□にあてはまるものを選びなさい。
    「1組の辺とその□がそれぞれ等しいとき、2つの三角形は合同である。」

correct_by_case:
  1: "辺"
  2: "間の角"
  3: "両端の角"

distractors_by_case:
  1: ["角", "間の角", "両端の角"]
  2: ["両端の角", "対角", "辺"]
  3: ["間の角", "対角", "辺"]

explanation: |
  三角形の合同条件は次の3つです。
  1. 3組の辺がそれぞれ等しい（三辺相等）
  2. 2組の辺とその間の角がそれぞれ等しい（二辺夾角相等）
  3. 1組の辺とその両端の角がそれぞれ等しい（一辺両端角相等）

status: draft
