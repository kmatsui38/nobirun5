title: 図形の移動
variables:
  q:
    type: int
    min: 1
    max: 4
constraints: []
derived: {}
case_var: q
body_by_case:
  1: 図形を一定の方向に、一定の長さだけずらす移動を何といいますか。
  2: 図形を1つの直線を折り目として折り返す移動を何といいますか。
  3: 図形を1つの点を中心として、一定の角度だけまわす移動を何といいますか。
  4: 180°の回転移動を特に何といいますか。
correct_by_case:
  1: 平行移動
  2: 対称移動
  3: 回転移動
  4: 点対称移動
