id: T-M1-B1-005
item: M1-B1
item_kind: thinking
item_index: 2
format: choice
difficulty: 1
title: 移動と対応
variables:
  q:
    type: int
    min: 1
    max: 3
constraints: []
derived: {}
case_var: q
body_by_case:
  1: 平行移動で、対応する2点を結んだ線分どうしの関係はどうなりますか。
  2: 対称移動で、対応する2点を結ぶ線分と対称の軸の関係はどうなりますか。
  3: 回転移動で、対応する2点と回転の中心Oまでの距離はどうなりますか。
correct_by_case:
  1: 平行で長さが等しい
  2: 対称の軸が線分を垂直に2等分する
  3: 等しい
distractors_by_case:
  1:
  - 垂直に交わる
  - 1点で交わる
  - 長さが2倍になる
  2:
  - 対称の軸と平行になる
  - 対称の軸と重なる
  - 関係はない
  3:
  - 2倍になる
  - 半分になる
  - 回転角によって変わる
explanation: |-
  移動しても図形の形と大きさは変わりません。
  平行移動では対応する点を結ぶ線分が平行で等長、対称移動では対称の軸が垂直二等分線、
  回転移動では回転の中心から対応する点までの距離が等しくなります。
