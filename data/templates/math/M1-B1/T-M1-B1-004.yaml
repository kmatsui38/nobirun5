body_by_case:
  1: 2点A, Bから等しい距離にある点を作図するには、何をかけばよいですか。
  2: 角を2等分する半直線を作図するには、何を利用しますか。
  3: 円の接線をかくとき、接点を通る半径と接線の関係はどうなりますか。
correct_by_case:
