id: T-M2-B1-005
item: M2-B1
item_kind: knowledge
item_index: 1
format: choice
difficulty: 1
title: 平行線と角
variables:
  q:
    type: int
    min: 1
    max: 4
constraints: []
derived: {}
case_var: q
body_by_case:
  1: 2直線が平行のとき、同位角どうしの関係はどうなりますか。
  2: 2直線が平行のとき、錯角どうしの関係はどうなりますか。
  3: 2直線に1つの直線が交わり、錯角が等しいとき、2直線はどうなりますか。
  4: 対頂角どうしの関係はどうなりますか。
correct_by_case:
  1: 等しい
  2: 等しい
  3: 平行である
  4: いつも等しい
distractors_by_case:
  1:
  - 和が180°になる
  - 差が90°になる
  - 関係はない
  2:
  - 和が180°になる
  - 差が90°になる
  - 関係はない
  3:
  - 垂直である
  - 必ず交わる
  - 何も言えない
  4:
  - 平行のときだけ等しい
  - 和が180°になる
  - 関係はない
explanation: |-
  対頂角はいつも等しくなります。2直線が平行のときは同位角・錯角がそれぞれ等しく、
  逆に同位角または錯角が等しければ、2直線は平行であるといえます。
status: draft
