id: T-M2-B1-006
item: M2-B1
item_kind: thinking
item_index: 1
format: choice
difficulty: 2
title: 角の性質を使った説明
variables:
  q:
    type: int
    min: 1
    max: 3
constraints: []
derived: {}
case_var: q
body_by_case:
  1: 三角形の内角の和が180°であることは、どの性質を使って説明できますか。
  2: 三角形の外角は、それととなり合わない2つの内角の和とどんな関係ですか。
  3: 多角形の外角の和が360°になるのは何角形のときですか。
correct_by_case:
  1: 平行線の錯角・同位角が等しいこと
  2: 等しい
  3: どの多角形でも360°
distractors_by_case:
  1:
  - 三角形の合同条件
  - 円周角の定理
  - 三平方の定理
  2:
  - 和が180°になる
  - 半分になる
  - 関係はない
  3:
  - 三角形のときだけ
  - 正多角形のときだけ
  - 四角形以上のとき
explanation: |-
  1つの頂点を通り対辺に平行な直線をひくと、錯角・同位角が等しいことから
  三角形の内角の和が180°であることを説明できます。
  外角の和は、どの多角形でも360°になります。
status: draft
