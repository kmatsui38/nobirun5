id: T-M2-A2-002
item: M2-A2
item_kind: knowledge
item_index: 3
format: numeric
difficulty: 2
title: 連立方程式（代入法）
variables:
  m:
    type: int
    min: -4
    max: 4
    exclude:
    - 0
  n:
    type: int
    min: -9
    max: 9
  x0:
    type: int
    min: -6
    max: 6
  a:
    type: int
    min: 1
    max: 5
  b:
    type: int
    min: 1
    max: 5
constraints: []
derived:
  y0: m * x0 + n
  c: a * x0 + b * (m * x0 + n)
body: |-
  次の連立方程式を解きなさい。
  y = {m}x + ({n})
  {a}x + {b}y = {c}
answers:
  x: x0
  y: y0
explanation: |-
  1つ目の式を2つ目の式に代入します。
  {a}x + {b}({m}x + ({n})) = {c}
  これを解いて x = {x0}
  1つ目の式に代入して y = {y0}
status: draft
