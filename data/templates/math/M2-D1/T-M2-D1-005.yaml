id: T-M2-D1-005
item: M2-D1
item_kind: thinking
item_index: 1
format: choice
difficulty: 2
title: 分布の比較と判断
variables:
  q:
    type: int
    min: 1
    max: 3
constraints: []
derived: {}
case_var: q
body_by_case:
  1: 2つの班の記録を比べるとき、箱ひげ図を使うとよいのはなぜですか。
  2: 箱ひげ図で、箱が右寄りにある集団について言えることはどれですか。
  3: 「平均値が高いほうが優れている」と結論づけるのが危ういのはなぜですか。
correct_by_case:
  1: 複数の分布を並べて比べやすいから
  2: 大きい値のほうにデータが寄っている
  3: 散らばりのようすが分からないから
distractors_by_case:
  1:
  - 平均値だけが分かるから
  - 個々の値がすべて分かるから
  - 計算しなくてよいから
  2:
  - データの個数が多い
  - 平均値が必ず中央値と等しい
  - 最大値が小さい
  3:
  - 平均値は計算できないから
  - 中央値のほうが必ず正しいから
  - データが少ないと平均は出せないから
explanation: |-
  箱ひげ図は複数の集団の分布を並べて比較するのに適しています。
  代表値だけでなく散らばりのようすも見て、批判的に判断することが大切です。
status: draft
