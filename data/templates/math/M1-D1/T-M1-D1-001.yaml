    max: 19
constraints: []
derived:
  n: '20'
  ans: a * 5
body: |-
  {n}人のクラスで、通学時間が10分未満の人は {a}人でした。
  この階級の相対度数を百分率（％）で答えなさい。
answers:
  割合: ans
explanation: |-
  相対度数は （その階級の度数）÷（度数の合計）で求めます。
  {a} ÷ {n} を計算し、100をかけると {ans}％ です。
