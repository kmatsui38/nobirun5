id: T-M1-D1-005
item: M1-D1
item_kind: thinking
item_index: 1
format: choice
difficulty: 2
title: 分布の読み取り
variables:
  q:
    type: int
    min: 1
    max: 3
constraints: []
derived: {}
case_var: q
body_by_case:
  1: 人数のちがう2つのクラスの分布を比べるとき、度数と相対度数のどちらを使うのが適切ですか。
  2: ヒストグラムから読み取れることとして正しいものはどれですか。
  3: 「平均値だけで判断してはいけない」といわれるのはなぜですか。
correct_by_case:
  1: 相対度数
  2: どの階級に多く集まっているか
  3: 極端な値の影響を受けやすいから
distractors_by_case:
  1:
  - 度数
  - 階級値
  - 累積度数
  2:
  - 1人ひとりの正確な値
  - データの合計金額
  - 調査した日付
  3:
  - 計算が難しいから
  - 必ず整数にならないから
  - 度数が分からないから
explanation: |-
  全体の人数がちがう集団を比べるときは、割合である相対度数を使います。
  ヒストグラムからは分布の中心や散らばりの傾向が読み取れます。平均値は極端な値の影響を受けるため、
  分布全体を見て批判的に判断することが大切です。
