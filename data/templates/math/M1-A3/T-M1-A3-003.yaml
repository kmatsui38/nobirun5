id: T-M1-A3-003
item: M1-A3
item_kind: knowledge
item_index: 1
format: choice
difficulty: 1
title: 方程式と解の意味
variables:
  q:
    type: int
    min: 1
    max: 3
constraints: []
derived: {}
case_var: q
body_by_case:
  1: 方程式の「解」とは何ですか。
  2: 等式の性質として正しいものはどれですか。
  3: 「移項」とは何をすることですか。
correct_by_case:
  1: 式を成り立たせる文字の値
  2: 両辺に同じ数をたしても等式は成り立つ
  3: 項の符号を変えて他方の辺に移すこと
distractors_by_case:
  1:
  - 式に出てくる文字
  - 式の左辺の値
  - 計算の途中の式
  2:
  - 両辺に別々の数をたしてもよい
  - 両辺を0でわってもよい
  - 左辺だけを2倍してもよい
  3:
  - 項を消すこと
  - 項をそのまま移すこと
  - 両辺を入れかえること
explanation: |-
  解とは、その値を代入すると等式が成り立つ文字の値です。
  等式の性質（両辺に同じ数をたす・ひく・かける、0でない同じ数でわる）を使って解きます。
  移項は、等式の性質から導かれる操作で、符号を変えて反対側の辺へ移します。
status: draft
