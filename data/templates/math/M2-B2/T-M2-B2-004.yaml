title: 証明の読み取り
variables:
  q:
    type: int
    min: 1
    max: 3
constraints: []
derived: {}
case_var: q
body_by_case:
  1: △ABCと△DEFで、AB=DE、∠B=∠E、BC=EF が分かっています。使える合同条件はどれですか。
  2: △ABCと△DEFで、∠B=∠E、BC=EF、∠C=∠F が分かっています。使える合同条件はどれですか。
  3: 「3組の角がそれぞれ等しい」が合同条件にならないのはなぜですか。
correct_by_case:
  1: 2組の辺とその間の角がそれぞれ等しい
  2: 1組の辺とその両端の角がそれぞれ等しい
  3: 形は同じでも大きさが違う場合があるから
distractors_by_case:
  1:
  - 3組の辺がそれぞれ等しい
  - 1組の辺とその両端の角がそれぞれ等しい
  - 3組の角がそれぞれ等しい
  2:
  - 3組の辺がそれぞれ等しい
  - 2組の辺とその間の角がそれぞれ等しい
  - 3組の角がそれぞれ等しい
  3:
  - 角は測りにくいから
  - 辺の情報がないと計算できないから
  - 3つも条件がいらないから
explanation: |-
  合同条件は「3組の辺」「2組の辺とその間の角」「1組の辺とその両端の角」の3つです。
  角だけがすべて等しい図形は相似ですが、大きさが異なる場合があるため合同とは限りません。
