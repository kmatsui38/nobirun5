case_var: q
body_by_case:
  1: 長方形を、1つの辺を軸として1回転させてできる立体はどれですか。
  2: 直角三角形を、直角をはさむ1辺を軸として1回転させてできる立体はどれですか。
  3: 半円を、直径を軸として1回転させてできる立体はどれですか。
  4: 立体を真上から見た図を何といいますか。
correct_by_case:
  1: 円柱
  2: 円錐
  3: 球
  4: 平面図
distractors_by_case:
