id: T-M2-D2-003
item: M2-D2
item_kind: knowledge
item_index: 1
format: choice
difficulty: 1
title: 場合の数と確率
variables:
  q:
    type: int
    min: 1
    max: 4
constraints: []
derived: {}
case_var: q
body_by_case:
  1: |-
    起こりうる場合が全部で n 通りあり、どれも同様に確からしいとき、
    ことがらAの起こる確率はどう求めますか。
  2: 「同様に確からしい」とはどういう意味ですか。
  3: 必ず起こることがらの確率はいくつですか。
  4: 決して起こらないことがらの確率はいくつですか。
correct_by_case:
  1: （Aが起こる場合の数）÷ n
  2: どの場合が起こることも同じ程度に期待できる
  3: '1'
  4: '0'
distractors_by_case:
  1:
  - n ÷（Aが起こる場合の数）
  - （Aが起こる場合の数）× n
  - n -（Aが起こる場合の数）
  2:
  - どの場合も必ず起こる
  - 回数を数えれば同じ数になる
  - 確率が1である
  3:
  - '0'
  - '0.5'
  - '100'
  4:
  - '1'
  - '0.5'
  - '-1'
explanation: |-
  同様に確からしいとき、確率は （あることがらが起こる場合の数）÷（起こりうるすべての場合の数）
  で求められます。確率は0以上1以下で、必ず起こるとき1、決して起こらないとき0です。
status: draft
