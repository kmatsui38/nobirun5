id: T-M2-D2-004
item: M2-D2
item_kind: thinking
item_index: 1
format: choice
difficulty: 2
title: 確率の求め方を考える
variables:
  q:
    type: int
    min: 1
    max: 3
constraints: []
derived: {}
case_var: q
body_by_case:
  1: 2枚の硬貨を投げるとき、起こりうる場合は何通りとして数えるのが正しいですか。
  2: 大小2つのさいころを投げるとき、起こりうる場合は何通りですか。
  3: 多数回の試行で求めた確率と、場合の数から求めた確率の関係はどれですか。
correct_by_case:
  1: （表,表）（表,裏）（裏,表）（裏,裏）の4通り
  2: 36通り
  3: 試行回数を増やすほど近づく
distractors_by_case:
  1:
  - 表2枚・1枚・0枚の3通り
  - 表と裏の2通り
  - 数えられない
  2:
  - 12通り
  - 21通り
  - 6通り
  3:
  - いつも同じ値になる
  - まったく別のものである
  - 多数回の試行のほうが必ず正確
explanation: |-
  確率を求めるときは、同様に確からしい場合をもれなく重複なく数えることが大切です。
  2枚の硬貨は区別して4通り、大小2つのさいころは 6 × 6 = 36通りと数えます。
status: draft
