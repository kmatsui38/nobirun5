body: |-
  {n}本のくじの中に当たりが {a}本あります。
  この中から1本引くとき、当たりを引く確率を百分率（％）で答えなさい。
answers:
  確率: ans
explanation: |-
  どのくじを引くことも同様に確からしいので、
  確率は （当たりの本数）÷（全部の本数）= {a} ÷ {n} です。
  百分率にすると {ans}％ です。
