id: T-M2-A1-007
item: M2-A1
item_kind: knowledge
item_index: 4
format: choice
difficulty: 2
title: 等式の変形
variables:
  q:
    type: int
    min: 1
    max: 3
constraints: []
derived: {}
case_var: q
body_by_case:
  1: 2x + y = 5 を y について解くとどうなりますか。
  2: S = ab を b について解くとどうなりますか。
  3: ℓ = 2(a + b) を a について解くとどうなりますか。
correct_by_case:
  1: y = -2x + 5
  2: b = S/a
  3: a = ℓ/2 - b
distractors_by_case:
  1:
  - y = 2x + 5
  - y = 5 - x
  - y = 2x - 5
  2:
  - b = aS
  - b = S - a
  - b = a/S
  3:
  - a = ℓ - 2b
  - a = 2ℓ - b
  - a = ℓ/2 + b
explanation: |-
  等式を「○について解く」とは、その文字だけが左辺に残る形に変形することです。
  等式の性質を使い、他の項を移項したり両辺を同じ数でわったりします。
status: draft
