id: T-M1-A2-008
item: M1-A2
item_kind: knowledge
item_index: 3
format: numeric
difficulty: 2
title: 一次式と数の乗法
variables:
  k:
    type: int
    min: -9
    max: 9
    exclude:
    - 0
    - 1
  a: &id001
    type: int
    min: -9
    max: 9
    exclude:
    - 0
  b: *id001
constraints: []
derived:
  kx: k * a
  kc: k * b
body: |-
  次の式を計算した結果について、xの係数と定数項を答えなさい。
  {k}({a}x + ({b}))
answers:
  xの係数: kx
  定数項: kc
explanation: |-
  分配法則を使って、かっこの中の各項に {k} をかけます。
  xの項: {k} × {a}x = {kx}x
  定数項: {k} × ({b}) = {kc}
