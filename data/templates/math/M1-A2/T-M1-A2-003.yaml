id: T-M1-A2-003
item: M1-A2
item_kind: knowledge
item_index: 3
format: numeric
difficulty: 2
title: 一次式の減法
variables:
  a: &id001
    type: int
    min: -9
    max: 9
    exclude:
    - 0
  b: *id001
  c: *id001
  d: *id001
constraints: []
derived:
  kx: a - c
  kc: b - d
body: |-
  次の式を計算した結果について、xの係数と定数項を答えなさい。
  ({a}x + ({b})) - ({c}x + ({d}))
answers:
  xの係数: kx
  定数項: kc
explanation: |-
  かっこの前が - のときは、かっこの中の各項の符号を変えてから同類項をまとめます。
  xの項: {a}x - {c}x = {kx}x
  定数項: ({b}) - ({d}) = {kc}
status: draft
