  - 係数
  2:
  - 関数
  - 座標
  - 比例定数
  3:
  - 半分、3分の1になる
  - 変わらない
  - 2倍、4倍になる
  4:
  - 2倍、3倍になる
  - 変わらない
  - 4倍、9倍になる
explanation: |-
  x の値を決めると y の値がただ1つ決まるとき、y は x の関数であるといいます。
  比例では x が2倍になると y も2倍に、反比例では x が2倍になると y は 1/2 倍になります。
