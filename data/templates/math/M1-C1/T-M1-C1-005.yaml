case_var: q
body_by_case:
  1: 2つの数量 x, y があり、x の値を決めると y の値がただ1つに決まるとき、y は x の何であるといいますか。
  2: 変数のとりうる値の範囲を何といいますか。
  3: 比例 y = ax で、x の値が2倍、3倍になると y の値はどうなりますか。
  4: 反比例 y = a/x で、x の値が2倍、3倍になると y の値はどうなりますか。
correct_by_case:
  1: 関数
  2: 変域
  3: 2倍、3倍になる
  4: 2分の1、3分の1になる
