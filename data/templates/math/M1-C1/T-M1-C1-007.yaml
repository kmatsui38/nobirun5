  1:
  - 反比例
  - 関数ではない
  - 常に一定の関係
  2:
  - 比例
  - 関数ではない
  - 和が一定の関係
  3:
  - 反比例
  - 関数ではない
  - 差が一定の関係
explanation: |-
  比例では y ÷ x が一定（比例定数）になり、反比例では x × y が一定（比例定数）になります。
  表・式・グラフを結びつけて特徴を読み取ります。
