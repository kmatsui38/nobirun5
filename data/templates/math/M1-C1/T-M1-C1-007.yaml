body_by_case:
  1: 表で、x が1増えるごとに y がいつも同じ数ずつ増えている関係はどれですか。
  2: 表で、x と y の積がいつも同じ数になっている関係はどれですか。
  3: 表で、x と y の商 y ÷ x がいつも同じ数になっている関係はどれですか。
