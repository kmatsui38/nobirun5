id: T-M1-A1-010
item: M1-A1
item_kind: thinking
item_index: 2
format: numeric
difficulty: 2
title: 基準を決めた処理
variables:
  base:
    type: int
    min: 60
    max: 80
  a: &id001
    type: int
    min: -9
    max: 9
    exclude:
    - 0
  b: *id001
  c: *id001
constraints: []
derived:
  total: a + b + c
  ans: base * 3 + a + b + c
body: |-
  3人のテストの得点を、{base}点を基準として表すと {a}, {b}, {c} でした。
  3人の合計得点を求めなさい。
answers:
  合計: ans
explanation: |-
  基準からの差の合計は {a} + ({b}) + ({c}) = {total} です。
  合計得点は {base} × 3 + ({total}) = {ans}（点）
status: draft
