id: T-M2-C1-004
item: M2-C1
item_kind: knowledge
item_index: 3
format: numeric
difficulty: 2
title: 二元一次方程式を関数とみる
variables:
  m:
    type: int
    min: -5
    max: 5
    exclude:
    - 0
  n:
    type: int
    min: -9
    max: 9
  k:
    type: int
    min: 1
    max: 4
constraints: []
derived:
  A: k * m
  B: 0 - k
  C: 0 - k * n
body: |-
  二元一次方程式 {A}x + ({B})y = {C} を y について解き、
  傾きと切片を答えなさい。
answers:
  傾き: m
  切片: n
explanation: |-
  y の項だけを左辺に残すように変形します。
  ({B})y = -({A})x + ({C})
  両辺を {B} でわると y = {m}x + ({n})
  よって傾きは {m}、切片は {n} です。
status: draft
