format: numeric
difficulty: 2
title: 一次関数とみられる事象
variables:
  n0:
    type: int
    min: 5
    max: 40
  m:
    type: int
    min: 2
    max: 12
  t:
    type: int
    min: 1
    max: 20
constraints: []
derived:
  mt: m * t
  ans: n0 + m * t
body: |-
  水そうに水が {n0}L 入っています。ここへ毎分 {m}L ずつ水を入れます。
  {t} 分後の水の量は何 L ですか。
answers:
  水の量: ans
explanation: |-
  x 分後の水の量 y L は y = {m}x + {n0} と表せます（一次関数）。
  x = {t} を代入して {m} × {t} = {mt}
  y = {mt} + {n0} = {ans}（L）
