id: T-M2-C1-003
item: M2-C1
item_kind: knowledge
item_index: 1
format: numeric
difficulty: 2
title: 2点から一次関数の式を求める
variables:
  m:
    type: int
    min: -5
    max: 5
    exclude:
    - 0
  n:
    type: int
    min: -9
    max: 9
  x1:
    type: int
    min: -5
    max: 5
  dx:
    type: int
    min: 1
    max: 6
constraints: []
derived:
  x2: x1 + dx
  y1: m * x1 + n
  y2: m * (x1 + dx) + n
  dy: m * dx
body: |-
  一次関数のグラフが2点 ({x1}, {y1}), ({x2}, {y2}) を通ります。
  この一次関数の傾きと切片を求めなさい。
answers:
  傾き: m
  切片: n
explanation: |-
  傾きは （yの増加量）÷（xの増加量）で求めます。
  ({y2} - ({y1})) ÷ ({x2} - ({x1})) = {dy} ÷ {dx} = {m}
  y = {m}x + b に ({x1}, {y1}) を代入して b = {n}
status: draft
