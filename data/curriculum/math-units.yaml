# nobirun5 単元マスタ — 中学校 数学
#
# 出典: 中学校学習指導要領（平成29年告示）第2章 第3節 数学
#       （「中学校学習指導要領解説 数学編」平成29年7月 付録3 より抽出）
# 各単元の items は指導要領の「内容」の事項を原文どおり収録している。
#   knowledge_skills = ア「知識及び技能」 / thinking_skills = イ「思考力，判断力，表現力等」
# terms は学年×領域ごとの〔用語・記号〕、handling は関連する〔内容の取扱い〕。
meta:
  subject: math
  subject_name: 数学
  school_level: 中学校
  source: 中学校学習指導要領（平成29年告示）第2章 第3節 数学
  source_note: 解説数学編（平成29年7月）付録3のPDFから抽出。抽出誤りの可能性があるため要スポットチェック。
  version: "0.1"

domains:
  - code: A
    name: 数と式
  - code: B
    name: 図形
  - code: C
    name: 関数
  - code: D
    name: データの活用

grades:
  - grade: 1
    label: 第1学年
    units:
      - id: M1-A1
        domain: A
        name: 正の数と負の数
        knowledge_skills:
          - 正の数と負の数の必要性と意味を理解すること
          - 正の数と負の数の四則計算をすること
          - 具体的な場面で正の数と負の数を用いて表したり処理したりすること
        thinking_skills:
          - 算数で学習した数の四則計算と関連付けて、正の数と負の数の四則計算の方法を考察し表現すること
          - 正の数と負の数を具体的な場面で活用すること
        handling:
          - 自然数を素数の積として表すことを取り扱う
          - 数の集合と四則計算の可能性を取り扱う
      - id: M1-A2
        domain: A
        name: 文字を用いた式
        knowledge_skills:
          - 文字を用いることの必要性と意味を理解すること
          - 文字を用いた式における乗法と除法の表し方を知ること
          - 簡単な一次式の加法と減法の計算をすること
          - 数量の関係や法則などを文字を用いた式に表すことができることを理解し、式を用いて表したり読み取ったりすること
        thinking_skills:
          - 具体的な場面と関連付けて、一次式の加法と減法の計算の方法を考察し表現すること
        handling:
          - 大小関係を不等式を用いて表すことを取り扱う
      - id: M1-A3
        domain: A
        name: 一元一次方程式
        knowledge_skills:
          - 方程式の必要性と意味及び方程式の中の文字や解の意味を理解すること
          - 簡単な一元一次方程式を解くこと
        thinking_skills:
          - 等式の性質を基にして、一元一次方程式を解く方法を考察し表現すること
          - 一元一次方程式を具体的な場面で活用すること
        handling:
          - 簡単な比例式を解くことを取り扱う
      - id: M1-B1
        domain: B
        name: 平面図形
        knowledge_skills:
          - 角の二等分線、線分の垂直二等分線、垂線などの基本的な作図の方法を理解すること
          - 平行移動、対称移動及び回転移動について理解すること
        thinking_skills:
          - 図形の性質に着目し、基本的な作図の方法を考察し表現すること
          - 図形の移動に着目し、二つの図形の関係について考察し表現すること
          - 基本的な作図や図形の移動を具体的な場面で活用すること
        handling:
          - 円の接線はその接点を通る半径に垂直であることを取り扱う
      - id: M1-B2
        domain: B
        name: 空間図形
        knowledge_skills:
          - 空間における直線や平面の位置関係を知ること
          - 扇形の弧の長さと面積、基本的な柱体や錐体、球の表面積と体積を求めること
        thinking_skills:
          - 空間図形を直線や平面図形の運動によって構成されるものと捉えたり、空間図形を平面上に表現して平面上の表現から空間図形の性質を見いだしたりすること
          - 立体図形の表面積や体積の求め方を考察し表現すること
        handling:
          - 見取図や展開図、投影図を取り扱う
      - id: M1-C1
        domain: C
        name: 比例、反比例
        knowledge_skills:
          - 関数関係の意味を理解すること
          - 比例、反比例について理解すること
          - 座標の意味を理解すること
          - 比例、反比例を表、式、グラフなどに表すこと
        thinking_skills:
          - 比例、反比例として捉えられる二つの数量について、表、式、グラフなどを用いて調べ、それらの変化や対応の特徴を見いだすこと
          - 比例、反比例を用いて具体的な事象を捉え考察し表現すること
      - id: M1-D1
        domain: D
        name: データの分布
        knowledge_skills:
          - ヒストグラムや相対度数などの必要性と意味を理解すること
          - コンピュータなどの情報手段を用いるなどしてデータを表やグラフに整理すること
        thinking_skills:
          - 目的に応じてデータを収集して分析し、そのデータの分布の傾向を読み取り、批判的に考察し判断すること
      - id: M1-D2
        domain: D
        name: 不確定な事象の起こりやすさ
        knowledge_skills:
          - 多数の観察や多数回の試行によって得られる確率の必要性と意味を理解すること
        thinking_skills:
          - 多数の観察や多数回の試行の結果を基にして、不確定な事象の起こりやすさの傾向を読み取り表現すること
    terms:
      A: [自然数, 素数, 符号, 絶対値, 項, 係数, 移項, ≦, ≧]
      B: [弧, 弦, 回転体, ねじれの位置, π, //, ⊥, ∠, △]
      C: [関数, 変数, 変域]
      D: [範囲, 累積度数]

  - grade: 2
    label: 第2学年
    units:
      - id: M2-A1
        domain: A
        name: 文字を用いた式
        knowledge_skills:
          - 簡単な整式の加法と減法及び単項式の乗法と除法の計算をすること
          - 具体的な事象の中の数量の関係を文字を用いた式で表したり、式の意味を読み取ったりすること
          - 文字を用いた式で数量及び数量の関係を捉え説明できることを理解すること
          - 目的に応じて、簡単な式を変形すること
        thinking_skills:
          - 具体的な数の計算や既に学習した計算の方法と関連付けて、整式の加法と減法及び単項式の乗法と除法の計算の方法を考察し表現すること
          - 文字を用いた式を具体的な場面で活用すること
      - id: M2-A2
        domain: A
        name: 連立二元一次方程式
        knowledge_skills:
          - 二元一次方程式とその解の意味を理解すること
          - 連立二元一次方程式の必要性と意味及びその解の意味を理解すること
          - 簡単な連立二元一次方程式を解くこと
        thinking_skills:
          - 一元一次方程式と関連付けて、連立二元一次方程式を解く方法を考察し表現すること
          - 連立二元一次方程式を具体的な場面で活用すること
      - id: M2-B1
        domain: B
        name: 基本的な平面図形の性質
        knowledge_skills:
          - 平行線や角の性質を理解すること
          - 多角形の角についての性質が見いだせることを知ること
        thinking_skills:
          - 基本的な平面図形の性質を見いだし、平行線や角の性質を基にしてそれらを確かめ説明すること
      - id: M2-B2
        domain: B
        name: 図形の合同
        knowledge_skills:
          - 平面図形の合同の意味及び三角形の合同条件について理解すること
          - 証明の必要性と意味及びその方法について理解すること
        thinking_skills:
          - 三角形の合同条件などを基にして三角形や平行四辺形の基本的な性質を論理的に確かめたり、証明を読んで新たな性質を見いだしたりすること
          - 三角形や平行四辺形の基本的な性質などを具体的な場面で活用すること
        handling:
          - 正方形、ひし形及び長方形が平行四辺形の特別な形であることを取り扱う
      - id: M2-C1
        domain: C
        name: 一次関数
        knowledge_skills:
          - 一次関数について理解すること
          - 事象の中には一次関数として捉えられるものがあることを知ること
          - 二元一次方程式を関数を表す式とみること
        thinking_skills:
          - 一次関数として捉えられる二つの数量について、変化や対応の特徴を見いだし、表、式、グラフを相互に関連付けて考察し表現すること
          - 一次関数を用いて具体的な事象を捉え考察し表現すること
      - id: M2-D1
        domain: D
        name: データの分布
        knowledge_skills:
          - 四分位範囲や箱ひげ図の必要性と意味を理解すること
          - コンピュータなどの情報手段を用いるなどしてデータを整理し箱ひげ図で表すこと
        thinking_skills:
          - 四分位範囲や箱ひげ図を用いてデータの分布の傾向を比較して読み取り、批判的に考察し判断すること
      - id: M2-D2
        domain: D
        name: 不確定な事象の起こりやすさ
        knowledge_skills:
          - 多数回の試行によって得られる確率と関連付けて、場合の数を基にして得られる確率の必要性と意味を理解すること
          - 簡単な場合について確率を求めること
        thinking_skills:
          - 同様に確からしいことに着目し、場合の数を基にして得られる確率の求め方を考察し表現すること
          - 確率を用いて不確定な事象を捉え考察し表現すること
    terms:
      A: [同類項]
      B: [対頂角, 内角, 外角, 定義, 証明, 逆, 反例, ≡]
      C: [変化の割合, 傾き]
      D: []

  - grade: 3
    label: 第3学年
    units:
      - id: M3-A1
        domain: A
        name: 正の数の平方根
        knowledge_skills:
          - 数の平方根の必要性と意味を理解すること
          - 数の平方根を含む簡単な式の計算をすること
          - 具体的な場面で数の平方根を用いて表したり処理したりすること
        thinking_skills:
          - 既に学習した計算の方法と関連付けて、数の平方根を含む式の計算の方法を考察し表現すること
          - 数の平方根を具体的な場面で活用すること
        handling:
          - 誤差や近似値、a×10^n の形の表現を取り扱う
      - id: M3-A2
        domain: A
        name: 簡単な多項式
        knowledge_skills:
          - 単項式と多項式の乗法及び多項式を単項式で割る除法の計算をすること
          - 簡単な一次式の乗法の計算及び公式 (a+b)²=a²+2ab+b² / (a−b)²=a²−2ab+b² / (a+b)(a−b)=a²−b² / (x+a)(x+b)=x²+(a+b)x+ab を用いる簡単な式の展開や因数分解をすること
        thinking_skills:
          - 既に学習した計算の方法と関連付けて、式の展開や因数分解をする方法を考察し表現すること
          - 文字を用いた式で数量及び数量の関係を捉え説明すること
      - id: M3-A3
        domain: A
        name: 二次方程式
        knowledge_skills:
          - 二次方程式の必要性と意味及びその解の意味を理解すること
          - 因数分解したり平方の形に変形したりして二次方程式を解くこと
          - 解の公式を知り、それを用いて二次方程式を解くこと
        thinking_skills:
          - 因数分解や平方根の考えを基にして、二次方程式を解く方法を考察し表現すること
          - 二次方程式を具体的な場面で活用すること
        handling:
          - 実数の解をもつ二次方程式を取り扱う
          - ax²=b（a、bは有理数）の二次方程式及び x²+px+q=0（p、qは整数）の二次方程式を取り扱う。平方の形に変形して解くことは x の係数が偶数であるものを中心に取り扱う
      - id: M3-B1
        domain: B
        name: 図形の相似
        knowledge_skills:
          - 平面図形の相似の意味及び三角形の相似条件について理解すること
          - 基本的な立体の相似の意味及び相似な図形の相似比と面積比や体積比との関係について理解すること
        thinking_skills:
          - 三角形の相似条件などを基にして図形の基本的な性質を論理的に確かめること
          - 平行線と線分の比についての性質を見いだし、それらを確かめること
          - 相似な図形の性質を具体的な場面で活用すること
      - id: M3-B2
        domain: B
        name: 円周角と中心角の関係
        knowledge_skills:
          - 円周角と中心角の関係の意味を理解し、それが証明できることを知ること
        thinking_skills:
          - 円周角と中心角の関係を見いだすこと
          - 円周角と中心角の関係を具体的な場面で活用すること
        handling:
          - 円周角の定理の逆を取り扱う
      - id: M3-B3
        domain: B
        name: 三平方の定理
        knowledge_skills:
          - 三平方の定理の意味を理解し、それが証明できることを知ること
        thinking_skills:
          - 三平方の定理を見いだすこと
          - 三平方の定理を具体的な場面で活用すること
      - id: M3-C1
        domain: C
        name: 関数 y=ax²
        knowledge_skills:
          - 関数 y=ax² について理解すること
          - 事象の中には関数 y=ax² として捉えられるものがあることを知ること
          - いろいろな事象の中に、関数関係があることを理解すること
        thinking_skills:
          - 関数 y=ax² として捉えられる二つの数量について、変化や対応の特徴を見いだし、表、式、グラフを相互に関連付けて考察し表現すること
          - 関数 y=ax² を用いて具体的な事象を捉え考察し表現すること
      - id: M3-D1
        domain: D
        name: 標本調査
        knowledge_skills:
          - 標本調査の必要性と意味を理解すること
          - コンピュータなどの情報手段を用いるなどして無作為に標本を取り出し、整理すること
        thinking_skills:
          - 標本調査の方法や結果を批判的に考察し表現すること
          - 簡単な場合について標本調査を行い、母集団の傾向を推定し判断すること
    terms:
      A: [根号, 有理数, 無理数, 因数, "√"]
      B: [∽]
      C: []
      D: [全数調査]
